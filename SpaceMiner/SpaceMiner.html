<!DOCTYPE html>
<html lang="en">
<head>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0">
    <meta content="SpaceMiner" property="title">
    <title>SpaceMiner</title>
    <link rel="icon" href="./Sprite/SpaceCrystal.png">
    <link rel="stylesheet" href="./CSS/98.css">
    <link rel="stylesheet" type="text/css" href="./CSS/SpaceMiner.css">
</head>

<body style="background-position: 234px 116px;">
    <!--Main Content-->
    <div class="window box" id="tab_main" style="width: 350px; height: 300px; left: 930px; top: 470px;">
        <div class="title-bar">
            <div class="title-bar-text">Space-Miner</div>
        </div>
        <div class="window-body">
            <p class="titleText">You have <a id="sc">0</a> Space-Crystals</p> <!--sc = Space Crystals-->
            <p style="margin-top: 4px">(<a id="scPerSecond">0</a>/s, <a id="scPerClick">1</a>/click)</p>
            <button style="min-width: 74px" onclick="produceSC()">Mine Space-Crystals</button><br>
            <button id="buyMinerButton" style="height: 34px; text-align: left" onclick="buyMiner()" disabled="">Buy a Miner<br>Costs: <a id="minerCost">20</a> gold</button>
            <button id="buyMaxMinerButton" style="height: 34px; min-width: 49px" onclick="buyMaxMiner()">Buy<br>max</button><br>
            <button id="minerAutoBuyMaxButton" style="display: none;" onclick="minerAutoBuyMax()">Auto buy max: On</button><br><br>

        </div>
    </div>

    <!--Settings-->
    <div class="window box" style="width: 150px; height: 50px; left: 5px; transform: none; padding-bottom: 8px; z-index: 1; display: none;">
        <div class="title-bar" style="background-image: linear-gradient(90deg, rgb(71, 71, 71), rgb(141, 136, 136));">
            <div class="title-bar-text">Settings</div>
            <div class="title-bar-controls">
                <!--<button aria-label="Close"></button>-->
        </div>
        <div class="window-body">
            <button style="width: 142px; margin-top: 4px" onclick="save()">  Manual save</button><br>
        </div>
    </div>

    <!--Scripts-->
    <script src="./Script/break_infinity.min.js"></script>
    <script src="./Script/sc.js"></script>
    <script src="./Script/script.js"></script>
    <script>load()</script>
    
</html>
